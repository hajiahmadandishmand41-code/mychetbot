name: Python CI

on:
  push:
    branches: [main, 'refactor/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q core providers tools interfaces mychatbot
      - run: python -m ruff check core providers tools interfaces mychatbot tests
      - run: python -m mypy core providers tools interfaces mychatbot
      - run: python -m pip_audit
      - run: python -c "import core; import providers; import tools; import interfaces; import mychatbot"
      - run: pytest -q
