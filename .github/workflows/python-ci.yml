name: CI

on:
  push:
    branches: [main, 'refactor/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13', '3.14']
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q core providers tools interfaces mychatbot tests

      - name: Ruff
        run: python -m ruff check core providers tools interfaces mychatbot tests

      - name: Mypy
        run: python -m mypy core providers tools interfaces mychatbot

      - name: Dependency audit
        run: python -m pip_audit -r requirements-prod.txt --progress-spinner off

      - name: Import smoke test
        run: python -c "import core, providers, tools, interfaces, mychatbot"

      - name: Test suite
        run: pytest -q

      - name: Shell syntax checks
        run: |
          bash -n termux/install.sh
          bash -n termux/start.sh
          bash -n termux/start_api.sh
          bash -n termux/start_telegram.sh
          bash -n termux/run_bridge.sh
          bash -n deploy/deploy.sh
