name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13', '3.14']
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Syntax and import checks
        run: |
          python -m compileall -q core providers tools interfaces mychatbot
          python -c "import core, providers, tools, interfaces, mychatbot"

      - name: Shell syntax checks
        run: |
          bash -n termux/install.sh
          bash -n termux/start.sh
          bash -n termux/start_api.sh
          bash -n termux/run_bridge.sh
          bash -n deploy/deploy.sh

      - name: Test suite
        run: pytest -q
