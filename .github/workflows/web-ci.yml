name: Web CI

on:
  push:
    branches: [main, 'refactor/**', 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      # Node 22 runners ship npm 10.9.x, which has a known Arborist
      # peer-dependency tree crash with some Vitest dependency graphs.
      - name: Upgrade npm
        run: npm install --global npm@11.19.1
      - name: Install dependencies
        run: npm install
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit/component tests
        run: npm test -- --reporter=verbose
      - name: Production build
        run: npm run build
