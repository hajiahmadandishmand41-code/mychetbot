[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mychatbot"
version = "0.3.0"
description = "Personal AI Assistant for Android + Termux"
requires-python = ">=3.10"
dependencies = [
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "python-dotenv==1.2.3",
  "fastapi==0.141.1",
  "uvicorn==0.52.3",
  "cryptography==50.0.0",
  "rich==15.0.0",
]

[project.scripts]
mychatbot = "interfaces.cli:entrypoint"

[tool.setuptools.packages.find]
include = ["core*", "providers*", "tools*", "interfaces*", "mychatbot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
