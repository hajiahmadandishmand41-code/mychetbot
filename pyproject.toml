[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mychatbot"
version = "0.3.0"
description = "Personal AI Assistant for Android + Termux"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "fastapi>=0.111,<1",
  "uvicorn>=0.30,<1",
  "cryptography>=42,<47",
  "rich>=13.7,<15",
]

[project.scripts]
mychatbot = "interfaces.cli:entrypoint"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["flutter_app", "android"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
