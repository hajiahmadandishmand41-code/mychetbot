[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mychatbot"
version = "0.2.0"
description = "Personal AI Assistant for Android + Termux"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "fastapi>=0.111,<1",
  "uvicorn>=0.30,<1",
  "cryptography>=42,<47",
  "rich>=13.7,<15",
]

[project.scripts]
mychatbot = "interfaces.cli:entrypoint"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
